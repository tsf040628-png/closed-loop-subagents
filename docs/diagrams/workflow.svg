<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">闭环子代理工作流与修正路由</title>
  <desc id="desc">工作流分为规划与批准、逐步执行、集成与闭环三个阶段。所有审阅发现都进入统一的最多八轮修正预算；规划、集成和收尾问题交给 Planner，执行缺陷交给 Executor，再由 Reviewer 独立复审。严重规划或路线错误可在第4轮起由 Reviewer 判断是否升级 Planner 模型。八轮耗尽后停止并询问用户是否授权追加轮次。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.8px; fill: #64748B; }
      .title { font-size: 32px; font-weight: 700; fill: #172B4D; }
      .subtitle { font-size: 16px; fill: #58677D; }
      .stage-title { font-size: 19px; font-weight: 700; fill: #24364F; }
      .stage-note { font-size: 13px; fill: #65758A; }
      .node-title { font-size: 18px; font-weight: 700; }
      .node-body { font-size: 14px; fill: #53647A; }
      .small { font-size: 12px; fill: #64748B; }
      .connector { fill: none; stroke: #718096; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .hotspot { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: opacity .2s ease, transform .2s ease, filter .2s ease; }
      .hotspot > rect { transition: stroke .2s ease, stroke-width .2s ease, filter .2s ease; }
      .hotspot:hover, .hotspot:focus-visible { filter: drop-shadow(0 7px 7px rgba(35, 77, 105, .16)); transform: translateY(-2px); }
      .hotspot:hover > rect:first-of-type, .hotspot:focus-visible > rect:first-of-type { stroke: #4B9ABB; stroke-width: 2.5px; }
      .connector { transition: stroke .22s ease, stroke-width .22s ease; }
    </style>
  </defs>

  <rect width="1680" height="1080" rx="28" fill="#F5F7FB"/>
  <text x="64" y="57" class="eyebrow">闭环子代理 · 工作流程</text>
  <text x="64" y="100" class="title">从计划审批到证据闭环</text>
  <text x="64" y="131" class="subtitle">Reviewer 分别把关计划、每个执行步骤和最终收尾；任何发现都进入同一条有界修正路径。</text>

  <!-- Stage 1: Plan and approval -->
  <rect x="60" y="165" width="470" height="485" rx="22" fill="#F5F0FC" stroke="#DDD0F2" stroke-width="1.5"/>
  <circle cx="94" cy="204" r="18" fill="#8056B3"/>
  <text x="94" y="209" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">01</text>
  <text x="124" y="210" class="stage-title">规划与批准</text>
  <text x="496" y="208" class="stage-note" text-anchor="end">先定标准，再执行</text>

  <a class="hotspot" href="https://github.com/tsf040628-png/closed-loop-subagents/blob/main/docs/diagrams/module-guide.md#用户输入" aria-label="查看用户输入说明">
  <rect x="90" y="248" width="410" height="60" rx="14" fill="#FFFFFF" stroke="#D8E0EA" stroke-width="1.3"/>
  <circle cx="116" cy="278" r="11" fill="#E9EEF5"/>
  <path d="M111 278h10M116 273v10" stroke="#43556D" stroke-width="1.6" stroke-linecap="round"/>
  <text x="140" y="284" font-size="16" font-weight="600" fill="#34465D">用户目标 · 约束 · 完成标准</text>
  </a>

  <path d="M295 308 V332" class="connector" marker-end="url(#arrow)"/>

  <a class="hotspot" href="https://github.com/tsf040628-png/closed-loop-subagents/blob/main/docs/diagrams/module-guide.md#规划与批准" aria-label="查看规划与批准说明">
  <rect x="90" y="338" width="410" height="112" rx="16" fill="#FFFFFF" stroke="#DCCDF5" stroke-width="1.5"/>
  <rect x="90" y="338" width="6" height="112" rx="3" fill="#8056B3"/>
  <text x="116" y="371" class="node-title" fill="#56327F">Planner · 规划代理</text>
  <text x="116" y="399" class="node-body">相关技术先例 · 拆解任务 · 定义验收标准</text>
  <rect x="112" y="414" width="366" height="25" rx="12.5" fill="#F5F0FC"/>
  <text x="295" y="431" class="small" text-anchor="middle" fill="#66488A">关键不确定性：询问用户并等待确认</text>
  </a>

  <path d="M295 450 V477" class="connector" marker-end="url(#arrow)"/>

  <a class="hotspot" href="https://github.com/tsf040628-png/closed-loop-subagents/blob/main/docs/diagrams/module-guide.md#审阅代理" aria-label="查看审阅代理说明">
  <rect x="90" y="483" width="410" height="80" rx="16" fill="#FFFFFF" stroke="#E8D7AC" stroke-width="1.5"/>
  <rect x="90" y="483" width="6" height="80" rx="3" fill="#B47B17"/>
  <text x="116" y="515" class="node-title" fill="#85590E">Reviewer · 独立审计划</text>
  <text x="116" y="540" class="node-body">检查步骤、验收标准、证据与风险</text>
  </a>

  <a class="hotspot" href="https://github.com/tsf040628-png/closed-loop-subagents/blob/main/docs/diagrams/module-guide.md#逐步执行" aria-label="查看逐步执行说明">
  <rect x="90" y="587" width="410" height="38" rx="19" fill="#EDE5F8"/>
  <text x="295" y="611" font-size="13" font-weight="700" text-anchor="middle" fill="#65468B">PASS → 进入逐步执行</text>
  </a>

  <!-- Stage 2: Stepwise execution -->
  <rect x="605" y="165" width="470" height="485" rx="22" fill="#EEF7FC" stroke="#C9E2F2" stroke-width="1.5"/>
  <circle cx="639" cy="204" r="18" fill="#2376A6"/>
  <text x="639" y="209" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">02</text>
  <text x="669" y="210" class="stage-title">逐步执行</text>
  <text x="1041" y="208" class="stage-note" text-anchor="end">一次只做一个获批步骤</text>

  <a class="hotspot" href="https://github.com/tsf040628-png/closed-loop-subagents/blob/main/docs/diagrams/module-guide.md#执行代理" aria-label="查看执行代理说明">
  <rect x="655" y="278" width="370" height="103" rx="16" fill="#FFFFFF" stroke="#C5DDF1" stroke-width="1.5"/>
  <rect x="655" y="278" width="6" height="103" rx="3" fill="#2376A6"/>
  <text x="681" y="312" class="node-title" fill="#155B83">Executor · 执行代理</text>
  <text x="681" y="340" class="node-body">执行当前步骤并提交产物与证据</text>
  <text x="681" y="362" class="small">只在批准范围内推进</text>
  </a>

  <path d="M840 381 V429" class="connector" marker-end="url(#arrow)"/>

  <a class="hotspot" href="https://github.com/tsf040628-png/closed-loop-subagents/blob/main/docs/diagrams/module-guide.md#审阅代理" aria-label="查看审阅代理说明">
  <rect x="655" y="435" width="370" height="103" rx="16" fill="#FFFFFF" stroke="#E8D7AC" stroke-width="1.5"/>
  <rect x="655" y="435" width="6" height="103" rx="3" fill="#B47B17"/>
  <text x="681" y="469" class="node-title" fill="#85590E">Reviewer · 独立验收</text>
  <text x="681" y="497" class="node-body">对照标准核验证据与结果</text>
  <text x="681" y="519" class="small">PASS 才能继续；缺陷进入统一修正路径</text>
  </a>

  <!-- Per-step loop -->
  <path d="M655 486 H630 V329 H655" class="connector" marker-end="url(#arrow)"/>
  <a class="hotspot" href="https://github.com/tsf040628-png/closed-loop-subagents/blob/main/docs/diagrams/module-guide.md#逐步执行" aria-label="查看逐步执行说明">
  <rect x="655" y="574" width="370" height="51" rx="14" fill="#E1F0F8"/>
  <text x="840" y="596" font-size="13" font-weight="700" text-anchor="middle" fill="#155B83">每个步骤 PASS 后再推进</text>
  <text x="840" y="615" class="small" text-anchor="middle" fill="#466A82">全部批准步骤通过 → 最终整合</text>
  </a>

  <!-- Stage 3: Integration and closure -->
  <rect x="1150" y="165" width="470" height="485" rx="22" fill="#F2F5F8" stroke="#D8E0E8" stroke-width="1.5"/>
  <circle cx="1184" cy="204" r="18" fill="#53677E"/>
  <text x="1184" y="209" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">03</text>
  <text x="1214" y="210" class="stage-title">集成与闭环</text>
  <text x="1586" y="208" class="stage-note" text-anchor="end">交付前再验一次</text>

  <a class="hotspot" href="https://github.com/tsf040628-png/closed-loop-subagents/blob/main/docs/diagrams/module-guide.md#集成与闭环" aria-label="查看集成与闭环说明">
  <rect x="1180" y="246" width="410" height="69" rx="14" fill="#FFFFFF" stroke="#DCCDF5" stroke-width="1.4"/>
  <rect x="1180" y="246" width="5" height="69" rx="2.5" fill="#8056B3"/>
  <text x="1202" y="275" font-size="16" font-weight="700" fill="#56327F">Planner · 集成最终产物</text>
  <text x="1202" y="297" class="small">保留重要日志与关键记录</text>
  </a>

  <path d="M1385 315 V330" class="connector" marker-end="url(#arrow)"/>
  <a class="hotspot" href="https://github.com/tsf040628-png/closed-loop-subagents/blob/main/docs/diagrams/module-guide.md#审阅代理" aria-label="查看审阅代理说明">
  <rect x="1180" y="336" width="410" height="69" rx="14" fill="#FFFFFF" stroke="#E8D7AC" stroke-width="1.4"/>
  <rect x="1180" y="336" width="5" height="69" rx="2.5" fill="#B47B17"/>
  <text x="1202" y="365" font-size="16" font-weight="700" fill="#85590E">Reviewer · 审终稿与清理清单</text>
  <text x="1202" y="387" class="small">清理动作须先获独立批准</text>
  </a>

  <path d="M1385 405 V420" class="connector" marker-end="url(#arrow)"/>
  <a class="hotspot" href="https://github.com/tsf040628-png/closed-loop-subagents/blob/main/docs/diagrams/module-guide.md#集成与闭环" aria-label="查看集成与闭环说明">
  <rect x="1180" y="426" width="410" height="69" rx="14" fill="#FFFFFF" stroke="#DCCDF5" stroke-width="1.4"/>
  <rect x="1180" y="426" width="5" height="69" rx="2.5" fill="#8056B3"/>
  <text x="1202" y="455" font-size="16" font-weight="700" fill="#56327F">Planner · 按清单清理</text>
  <text x="1202" y="477" class="small">提交清理回执与最终文件</text>
  </a>

  <path d="M1385 495 V510" class="connector" marker-end="url(#arrow)"/>
  <a class="hotspot" href="https://github.com/tsf040628-png/closed-loop-subagents/blob/main/docs/diagrams/module-guide.md#审阅代理" aria-label="查看审阅代理说明">
  <rect x="1180" y="516" width="410" height="69" rx="14" fill="#FFFFFF" stroke="#E8D7AC" stroke-width="1.4"/>
  <rect x="1180" y="516" width="5" height="69" rx="2.5" fill="#B47B17"/>
  <text x="1202" y="545" font-size="16" font-weight="700" fill="#85590E">Reviewer · 闭环复核</text>
  <text x="1202" y="567" class="small">核对产物、证据、日志与状态</text>
  </a>

  <a class="hotspot" href="https://github.com/tsf040628-png/closed-loop-subagents/blob/main/docs/diagrams/module-guide.md#交付结果" aria-label="查看交付结果说明">
  <rect x="1180" y="597" width="410" height="32" rx="16" fill="#DDF1E9"/>
  <path d="M1200 613l5 5 10-11" fill="none" stroke="#28775F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1225" y="618" font-size="13" font-weight="700" fill="#205F4D">PASS → 完成并交付</text>
  </a>

  <!-- Stage transitions -->
  <path d="M530 400 H605" class="connector" marker-end="url(#arrow)"/>
  <text x="567.5" y="381" font-size="11" font-weight="700" text-anchor="middle" fill="#64748B">PASS</text>
  <path d="M1075 400 H1150" class="connector" marker-end="url(#arrow)"/>
  <text x="1112.5" y="381" font-size="10" font-weight="700" text-anchor="middle" fill="#64748B">全部 PASS</text>

  <!-- Shared correction budget -->
  <rect x="60" y="695" width="1560" height="330" rx="22" fill="#FFFFFF" stroke="#D8E0EA" stroke-width="1.5"/>
  <text x="92" y="741" font-size="12" font-weight="700" letter-spacing="1.5" fill="#64748B">统一修正路径</text>
  <text x="92" y="774" font-size="22" font-weight="700" fill="#172B4D">所有审阅发现进入同一条修正路径</text>
  <rect x="1363" y="720" width="220" height="42" rx="21" fill="#FFF2D8" stroke="#EBD7A4" stroke-width="1"/>
  <text x="1473" y="747" font-size="15" font-weight="700" text-anchor="middle" fill="#85590E">全局上限 · 8 轮</text>

  <!-- Route cards -->
  <a class="hotspot" href="https://github.com/tsf040628-png/closed-loop-subagents/blob/main/docs/diagrams/module-guide.md#全局修正预算" aria-label="查看全局修正预算说明">
  <rect x="90" y="802" width="335" height="106" rx="16" fill="#F7F9FC" stroke="#D8E0EA" stroke-width="1.3"/>
  <circle cx="119" cy="833" r="13" fill="#FBF2DD"/>
  <path d="M112 833c2.5-5 11.5-5 14 0-2.5 5-11.5 5-14 0z" fill="none" stroke="#9B6710" stroke-width="1.5"/>
  <circle cx="119" cy="833" r="2" fill="#9B6710"/>
  <text x="143" y="839" font-size="17" font-weight="700" fill="#34465D">审阅发现</text>
  <text x="114" y="873" class="node-body">计划缺口 · 执行缺陷 · 收尾问题</text>
  </a>

  <path d="M425 855 H465" class="connector" marker-end="url(#arrow)"/>

  <a class="hotspot" href="https://github.com/tsf040628-png/closed-loop-subagents/blob/main/docs/diagrams/module-guide.md#全局修正预算" aria-label="查看全局修正预算说明">
  <rect x="475" y="802" width="335" height="106" rx="16" fill="#FFF9EC" stroke="#EBD7A4" stroke-width="1.3"/>
  <circle cx="504" cy="833" r="13" fill="#FBECC9"/>
  <path d="M504 825v8l5 3" fill="none" stroke="#9B6710" stroke-width="1.7" stroke-linecap="round"/>
  <circle cx="504" cy="833" r="8" fill="none" stroke="#9B6710" stroke-width="1.4"/>
  <text x="528" y="839" font-size="17" font-weight="700" fill="#85590E">统一修正预算</text>
  <text x="499" y="873" class="node-body">每轮 = 一次修正 + 一次独立复审</text>
  </a>

  <path d="M810 855 H850" class="connector" marker-end="url(#arrow)"/>

  <a class="hotspot" href="https://github.com/tsf040628-png/closed-loop-subagents/blob/main/docs/diagrams/module-guide.md#全局修正预算" aria-label="查看缺陷回派规则说明">
  <rect x="860" y="802" width="335" height="106" rx="16" fill="#F7F9FC" stroke="#D8E0EA" stroke-width="1.3"/>
  <circle cx="889" cy="833" r="13" fill="#E9EEF5"/>
  <path d="M883 833h12M889 827v12" stroke="#43556D" stroke-width="1.6" stroke-linecap="round"/>
  <text x="913" y="839" font-size="17" font-weight="700" fill="#34465D">按缺陷类型回派</text>
  <text x="884" y="868" font-size="12" fill="#53647A">规划 / 集成 / 收尾 → Planner</text>
  <text x="884" y="888" font-size="12" fill="#53647A">执行缺陷 → Executor</text>
  </a>

  <path d="M1195 855 H1235" class="connector" marker-end="url(#arrow)"/>

  <a class="hotspot" href="https://github.com/tsf040628-png/closed-loop-subagents/blob/main/docs/diagrams/module-guide.md#全局修正预算" aria-label="查看独立复审说明">
  <rect x="1245" y="802" width="335" height="106" rx="16" fill="#F7F9FC" stroke="#D8E0EA" stroke-width="1.3"/>
  <circle cx="1274" cy="833" r="13" fill="#FBF2DD"/>
  <path d="M1267 833c2.5-5 11.5-5 14 0-2.5 5-11.5 5-14 0z" fill="none" stroke="#9B6710" stroke-width="1.5"/>
  <circle cx="1274" cy="833" r="2" fill="#9B6710"/>
  <text x="1298" y="839" font-size="17" font-weight="700" fill="#34465D">Reviewer 独立复审</text>
  <text x="1269" y="868" font-size="12" fill="#53647A">PASS → 回到主线继续</text>
  <text x="1269" y="888" font-size="12" fill="#53647A">未通过 → 再进入预算门</text>
  </a>

  <!-- Bounded upgrade and exhaustion policy -->
  <a class="hotspot" href="https://github.com/tsf040628-png/closed-loop-subagents/blob/main/docs/diagrams/module-guide.md#模型升级与轮次上限" aria-label="查看模型升级与轮次上限说明">
  <rect x="90" y="936" width="720" height="62" rx="14" fill="#F5F0FC"/>
  <text x="114" y="961" font-size="13" font-weight="700" fill="#56327F">模型升级</text>
  <text x="114" y="983" font-size="12" fill="#53647A">第 4 轮起，严重规划或路线错误时，Reviewer 可决定将 Planner 升至 gpt-6.1-sol / medium。</text>
  </a>

  <a class="hotspot" href="https://github.com/tsf040628-png/closed-loop-subagents/blob/main/docs/diagrams/module-guide.md#模型升级与轮次上限" aria-label="查看轮次上限说明">
  <rect x="830" y="936" width="750" height="62" rx="14" fill="#FFF9EC"/>
  <text x="854" y="961" font-size="13" font-weight="700" fill="#85590E">达到上限仍未完成</text>
  <text x="854" y="983" font-size="12" fill="#53647A">停止并报告剩余问题，再询问用户是否授权有界追加轮次。</text>
  </a>
</svg>
